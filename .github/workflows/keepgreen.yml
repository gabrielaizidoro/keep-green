name: Verde Diário

on:
  schedule:
    - cron: "0 12 * * *" # Todos os dias às 09h, horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manter-verde:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Atualizar data no README
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          arquivo = Path("README.md")
          conteudo = arquivo.read_text(encoding="utf-8")

          agora = datetime.now(
              ZoneInfo("America/Sao_Paulo")
          ).strftime("%d/%m/%Y às %H:%M:%S")

          nova_linha = (
              f"🔄 Última atualização automática: "
              f"{agora} (horário de Brasília)"
          )

          padrao = r"(?m)^🔄 Última atualização automática:.*$"

          if re.search(padrao, conteudo):
              conteudo = re.sub(
                  padrao,
                  nova_linha,
                  conteudo,
                  count=1
              )
          else:
              conteudo += f"\n\n{nova_linha}\n"

          arquivo.write_text(conteudo, encoding="utf-8")
          PY

      - name: Commit e Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gabrielaizidoro"
          git config user.email "48991688+gabrielaizidoro@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi

          git commit -m "🌱 Atualização automática - $(TZ='America/Sao_Paulo' date +'%d/%m/%Y')"

          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"

          git push
